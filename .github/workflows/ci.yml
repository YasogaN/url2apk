name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the SDK; setup-android@v3 fails trying to
      # install the retired "tools" package.
      - name: Install SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Check and build the shell
        working-directory: android
        run: ./gradlew :app:check :app:assembleRelease --no-daemon
      - name: Export the unsigned template
        working-directory: android
        run: tools/export-template.sh "$RUNNER_TEMP/shell.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-shell
          path: ${{ runner.temp }}/shell.apk
          if-no-files-found: error

  web:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-shell
          path: web/public
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools for the APK integration test
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "build-tools;36.0.0"
          {
            echo "AAPT2=$ANDROID_HOME/build-tools/36.0.0/aapt2"
            echo "APKSIGNER=$ANDROID_HOME/build-tools/36.0.0/apksigner"
            echo "ZIPALIGN=$ANDROID_HOME/build-tools/36.0.0/zipalign"
          } >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Test with the 100% coverage gate
        working-directory: web
        run: pnpm test:coverage
      - name: Build the static site and worker
        working-directory: web
        run: pnpm build
      - name: Start the built site
        working-directory: web
        run: |
          pnpm exec wrangler dev --config dist/url_to_app/wrangler.json --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          npx --yes wait-on@8 http://127.0.0.1:8787/ --timeout 30000
      - name: Check discovery and not-found responses
        working-directory: web
        run: pnpm check:site http://127.0.0.1:8787
      - name: Check the Lighthouse budgets
        working-directory: web
        run: |
          curl -fsS --retry 5 --retry-delay 1 http://127.0.0.1:8787/ >/dev/null
          npx --yes lighthouse@12 http://127.0.0.1:8787/ --output=json --output-path=/tmp/lighthouse-warmup.json --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage" --quiet || true
          for run in 1 2 3; do
            npx --yes lighthouse@12 http://127.0.0.1:8787/ --output=json --output-path="/tmp/lighthouse-$run.json" --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage" --quiet || echo "Lighthouse run $run failed."
          done
          node tools/check-lighthouse.mjs /tmp/lighthouse-1.json /tmp/lighthouse-2.json /tmp/lighthouse-3.json

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Test the AppImage repacker
        run: cargo test --manifest-path web/wasm/appimage-repack/Cargo.toml
      - name: Build the browser module
        run: ./web/wasm/appimage-repack/build.sh

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Test the core and installer helper
        working-directory: desktop
        run: cargo test -p url2app-shell-core -p url2app-installer-helper
      - name: Check the Tauri shell
        working-directory: desktop
        run: cargo check -p url2app-shell
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Add LLVM coverage tools
        run: rustup component add llvm-tools-preview
      - name: Rust coverage gate
        working-directory: desktop
        run: |
          cargo llvm-cov -p url2app-shell-core --tests --ignore-filename-regex 'core/tests/' --lcov --output-path /tmp/core.lcov --fail-under-functions 100
          cargo llvm-cov -p url2app-installer-helper --tests --ignore-filename-regex 'core/|installer-helper/tests/|installer-helper/src/main.rs' --lcov --output-path /tmp/helper.lcov --fail-under-functions 100
          node tools/check-lcov.mjs /tmp/core.lcov /tmp/helper.lcov
