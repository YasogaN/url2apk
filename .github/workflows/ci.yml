name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the SDK; setup-android@v3 fails trying to
      # install the retired "tools" package.
      - name: Install SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Check and build the shell
        working-directory: android
        run: ./gradlew :app:check :app:assembleRelease --no-daemon
      - name: Export the unsigned template
        working-directory: android
        run: tools/export-template.sh "$RUNNER_TEMP/shell.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-shell
          path: ${{ runner.temp }}/shell.apk
          if-no-files-found: error

  web:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-shell
          path: web/public
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools for the APK integration test
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "build-tools;36.0.0"
          {
            echo "AAPT2=$ANDROID_HOME/build-tools/36.0.0/aapt2"
            echo "APKSIGNER=$ANDROID_HOME/build-tools/36.0.0/apksigner"
            echo "ZIPALIGN=$ANDROID_HOME/build-tools/36.0.0/zipalign"
          } >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Test with the 100% coverage gate
        working-directory: web
        run: pnpm test:coverage
      - name: Build the static site and worker
        working-directory: web
        run: pnpm build
