name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check and build the shell
        working-directory: android
        run: ./gradlew :app:check :app:assembleRelease --no-daemon

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools for the APK integration test
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "build-tools;36.0.0"
          {
            echo "AAPT2=$ANDROID_HOME/build-tools/36.0.0/aapt2"
            echo "APKSIGNER=$ANDROID_HOME/build-tools/36.0.0/apksigner"
            echo "ZIPALIGN=$ANDROID_HOME/build-tools/36.0.0/zipalign"
          } >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Test with the 100% coverage gate
        working-directory: web
        run: pnpm test:coverage
      - name: Build the static site and worker
        working-directory: web
        run: pnpm build
