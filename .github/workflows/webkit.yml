name: Update bundled WebKit

# Rebuild only the bundled-WebKit AppImages when Ubuntu publishes a WebKitGTK
# security update, then redeploy the site with the unchanged shell bases and the
# new AppImages. The deployed shell version in shells.json stays the same.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Redeploy the site with the rebuilt AppImages
        type: boolean
        default: true
      force:
        description: Rebuild even if the WebKit package version is unchanged
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      shell_sha: ${{ steps.manifest.outputs.shell_sha }}
      current_package: ${{ steps.manifest.outputs.current_package }}
      candidate_package: ${{ steps.available.outputs.candidate_package }}
      candidate_version: ${{ steps.available.outputs.candidate_version }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read the deployed manifest
        id: manifest
        run: |
          curl -fsSL https://url2app.yasogan.dev/shells.json -o "$RUNNER_TEMP/shells.json"
          shell_sha="$(node -e 'const m=require(process.argv[1]); process.stdout.write(m.version ?? "")' "$RUNNER_TEMP/shells.json")"
          current_package="$(node -e 'const m=require(process.argv[1]); process.stdout.write(m.webkit?.package ?? "")' "$RUNNER_TEMP/shells.json")"
          test -n "$shell_sha"
          printf 'shell_sha=%s\n' "$shell_sha" >> "$GITHUB_OUTPUT"
          printf 'current_package=%s\n' "$current_package" >> "$GITHUB_OUTPUT"
      - name: Find the latest WebKitGTK package
        id: available
        run: |
          sudo apt-get update
          candidate_package="$(apt-cache policy libwebkit2gtk-4.1-0 | awk '/^  Candidate:/{print $2}')"
          test -n "$candidate_package"
          candidate_version="${candidate_package%%-*}"
          printf 'candidate_package=%s\n' "$candidate_package" >> "$GITHUB_OUTPUT"
          printf 'candidate_version=%s\n' "$candidate_version" >> "$GITHUB_OUTPUT"
      - name: Decide whether a rebuild is needed
        id: compare
        env:
          CURRENT: ${{ steps.manifest.outputs.current_package }}
          CANDIDATE: ${{ steps.available.outputs.candidate_package }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ] || [ "$CURRENT" != "$CANDIDATE" ]; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize
        run: |
          {
            echo "### Bundled WebKit update"
            echo ""
            echo "- Deployed shell: ${{ steps.manifest.outputs.shell_sha }}"
            echo "- Deployed WebKit package: ${CURRENT:-unknown}"
            echo "- Available WebKit package: ${{ steps.available.outputs.candidate_package }}"
            echo "- Rebuild: ${{ steps.compare.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CURRENT: ${{ steps.manifest.outputs.current_package }}

  full-appimage:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            runtime: runtime-x86_64
            runtime_sha: 617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46
          - runner: ubuntu-22.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            runtime: runtime-aarch64
            runtime_sha: 9a72a744d221576c9347ec074243acc5c3c7568896b12714e0e82e9f0bf47900
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the deployed shell source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.shell_sha }}
          path: shell
      - name: Check out the current tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 squashfs-tools
      - name: Verify the installed WebKit package
        env:
          EXPECTED: ${{ needs.prepare.outputs.candidate_package }}
        run: |
          actual="$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Expected WebKit $EXPECTED, found $actual"
            exit 1
          fi
      - name: Install the Tauri CLI
        run: npm install --global @tauri-apps/cli@^2
      - name: Build the bundled-WebKit AppImage
        working-directory: shell/desktop/app
        env:
          # linuxdeploy's bundled strip cannot parse newer WebKitGTK libraries.
          NO_STRIP: "true"
        run: tauri build --bundles appimage
      - name: Download the static AppImage runtime
        run: |
          curl -fsSL "https://github.com/AppImage/type2-runtime/releases/download/continuous/${{ matrix.runtime }}" -o "$RUNNER_TEMP/runtime"
          echo "${{ matrix.runtime_sha }}  $RUNNER_TEMP/runtime" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/runtime"
      - name: Repack and split the AppImage
        run: |
          mkdir -p new-full
          source="$(find shell/desktop/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n1)"
          test -n "$source"
          tools/desktop/tools/repack-appimage.sh "$source" "$RUNNER_TEMP/runtime" "new-full/linux-${{ matrix.arch }}-full.AppImage"
          full="new-full/linux-${{ matrix.arch }}-full.AppImage"
          split -b 20M -d -a 3 "$full" "$full.part-"
          rm "$full"
          ls -l new-full
      - uses: actions/upload-artifact@v4
        with:
          name: webkit-${{ matrix.arch }}
          path: new-full
          if-no-files-found: error

  package:
    needs: [prepare, full-appimage]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          pattern: webkit-*
          path: new-full
          merge-multiple: true
      - name: Stage the unchanged shell assets
        run: |
          curl -fsSL https://url2app.yasogan.dev/shell.apk -o web/public/shell.apk
          node desktop/tools/stage-production-assets.mjs "https://url2app.yasogan.dev/shells.json" web/public linux-appimage-full
      - name: Stage the rebuilt AppImages
        run: |
          dest="web/public/shells/webkit/${{ needs.prepare.outputs.candidate_version }}"
          mkdir -p "$dest"
          cp new-full/*.part-* "$dest/"
      - name: Merge the new AppImages into the manifest
        run: |
          node desktop/tools/merge-webkit-manifest.mjs \
            web/public/shells.json \
            new-full \
            "/shells/webkit/${{ needs.prepare.outputs.candidate_version }}" \
            "${{ needs.prepare.outputs.candidate_version }}" \
            "${{ needs.prepare.outputs.candidate_package }}" \
            web/public/shells.json
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build the site
        working-directory: web
        run: pnpm build
      - name: Start the built site
        working-directory: web
        run: |
          pnpm exec wrangler dev --config dist/url_to_app/wrangler.json --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          npx --yes wait-on@8 http://127.0.0.1:8787/ --timeout 30000
      - name: Check discovery and not-found responses
        working-directory: web
        run: pnpm check:site http://127.0.0.1:8787
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    needs: [prepare, package]
    if: needs.prepare.outputs.changed == 'true' && inputs.deploy
    runs-on: ubuntu-22.04
    environment:
      name: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Publish
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/url_to_app/wrangler.json
      - name: Verify the deployed manifest
        env:
          EXPECTED: ${{ needs.prepare.outputs.candidate_package }}
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsSL https://url2app.yasogan.dev/shells.json -o "$RUNNER_TEMP/deployed.json" \
              && node -e 'const m=require(process.argv[1]); process.exit(m.webkit?.package === process.env.EXPECTED ? 0 : 1)' "$RUNNER_TEMP/deployed.json"; then
              node -e 'const m=require(process.argv[1]); console.log(`Deployed WebKit ${m.webkit.version} (${m.webkit.package})`)' "$RUNNER_TEMP/deployed.json"
              exit 0
            fi
            sleep 3
          done
          echo "::error::The deployed manifest does not report WebKit $EXPECTED"
          cat "$RUNNER_TEMP/deployed.json" 2>/dev/null || true
          exit 1
