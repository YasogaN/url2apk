[package]
name = "url2app-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "URL-agnostic desktop shell for URL to App"

[build-dependencies]
tauri-build = { version = "2.5" }

[dependencies]
url2app-shell-core = { path = "../core" }
tauri = { version = "2.12", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
rfd = "0.17"
open = "5"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18"
webkit2gtk = { version = "2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
